<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
 <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  />
<
  <style>
    header{
        width:100%;
        color:white;
        height:80px;
        background-color:pink;
        font-size:60px;
        
    }
    body{
        margin:0;
        padding:0;
        background: black;
        text-align:center;
     }

     .pic
     {
        width:20%;
        box-shadow: 5px 5px 20px gray;
        transition: 0.50s;
        cursor: pointer;
        margin:5%;

     }

     .pic:hover{
        animation:pulse;
        animation-duration:0.50s;

     }
  </style>
  <header>
    Using Animation in Loop
  </header>

<body>
    <script>
        for (var i = 1;i<=10;i++)
    {
        var p = document.createElement("img")
        document.body.appendChild(p)
        p.src="image/p"+i+".jpg"
        p.className="pic"
    }
    </script>
    
</body>
</html>
