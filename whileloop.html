<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .mystyle
    {
        width:30px;
        height:30px;
        border-radius: 100px;
        box-shadow: 3px 3px 3px grey;
    }
</style>
<body>
    <script>
        /*WHILE LOOP*/

        var a = 1
        var c = 1
        var r,g,b,mycolor

        while(a<=40)
    {
        r = Math.round(Math.random()*255)
        g = Math.round(Math.random()*255)
        b = Math.round(Math.random()*255)
        mycolor ="rgb("+r+","+g+","+b+")"
        document.title = mycolor
document.write("<button style='background:"+mycolor+"' class='mystyle'>"+a+"</button>");
        a++
        if(c<=5)
    {
        c++
    }
    else{
        document.write("<br>")
        c=1
    }
    }
    </script>
    
</body>
</html>
