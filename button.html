<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>

    <style>
        :root{
            --mycolor:rgb(104,44,200);

        }
        .mybutton
        {
            background:var(--mycolor)
        }

    </style>
    <div class="container">
    <h1>Bootstrap button</h1>

    <button class="btn btn-success">Home</button>
    <button class="btn btn-danger">Product</button>
    <button class="btn btn-warning">Services</button>
    <button class="btn btn-light">About</button>
    <button class="btn btn-primary">Data</button>
    <button class="btn btn-info">Info</button>
    <br/>
    <button type="button" class="btn btn-link btn-secondary">Google</button>

    <br/>
    <input type="button" value="save">
    <br/>
    <a class="btn btn-success" href="http://yahoo.com" role="button">Open Yahoo</a>
    <br/>
    <button class="btn btn-outline-success">Home</button>
    <button class="btn btn-outline-danger">Product</button>
    <button class="btn btn-outline-warning">Services</button>
    <button class="btn btn-outline-primary">About</button>
    <button class="btn btn-outline-info">Info</button>
    <br/>

    <button type="button" class="btn btn-primary"style="--bs-btn-padding-y: .125rem; --bs-btn-padding-x: .5rem; --bs-btn-font-size:10rem;"> Custom button</button>
    <button class="btn mybutton">Mybutton</button> 
    <div class="d-grid gap-1">
        <button class="btn btn-primary" type="button">Button</button>
        </div>
             </div>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
